<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지도 운전게임</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --ink: #1d2433;
    --paper: rgba(255, 255, 255, 0.92);
    --car: #e8392b;
    --line: #d5d9e2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: var(--ink); }
  #map { position: absolute; inset: 0; background: #e9ecf1; }

  .hud { position: absolute; z-index: 1000; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(6px); }
  #speedo { left: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); min-width: 118px; }
  #speedo .num { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  #speedo .unit { font-size: 13px; margin-left: 4px; opacity: .65; }
  #help { right: 14px; top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 13px; line-height: 1.7; max-width: 240px; }
  #help b { font-weight: 600; }
  #help button { font: inherit; margin-top: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
  #help button:focus-visible, .pad button:focus-visible { outline: 2px solid var(--car); outline-offset: 2px; }

  .pad { position: absolute; z-index: 1000; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: none; gap: 10px; }
  .pad.left { left: 150px; }
  .pad.right { right: 14px; }
  .pad button { width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); font-size: 22px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad button.on { background: var(--car); color: #fff; border-color: var(--car); }
  @media (pointer: coarse) { .pad { display: flex; } #help .keys { display: none; } }

  .car-icon svg { display: block; transition: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
</style>
</head>
<body>
<div id="map"></div>

<div id="speedo" class="hud"><span class="num" id="spd">0</span><span class="unit">km/h</span></div>

<div id="help" class="hud">
  <div class="keys"><b>방향키 / WASD</b> 가속·후진·조향<br><b>스페이스</b> 브레이크<br></div>
  <b>R</b> 시작 위치로 복귀
  <br><button id="reset" type="button">처음으로</button>
</div>

<div class="pad left">
  <button data-k="left" aria-label="왼쪽">◀</button>
  <button data-k="right" aria-label="오른쪽">▶</button>
</div>
<div class="pad right">
  <button data-k="brake" aria-label="브레이크">■</button>
  <button data-k="up" aria-label="가속">▲</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  // ───────── 설정 ─────────
  const START = { lat: 37.5665, lng: 126.9780, heading: 0 };   // 서울 시청 근처
  const CFG = {
    accel: 14,        // 가속 (m/s²)
    brake: 34,        // 브레이크 (m/s²)
    drag: 0.35,       // 자연 감속 비율
    maxFwd: 55,       // 최고 속도 (m/s, 약 198km/h)
    maxRev: 8,        // 후진 최고 속도
    turnRate: 130,    // 최대 조향 속도 (도/초)
    zoomNear: 17.5,   // 정지 시 줌
    zoomFar: 15.6     // 최고속도 시 줌
  };

  // ───────── 지도 (API 키 불필요) ─────────
  const map = L.map('map', {
    zoomControl: false, zoomSnap: 0, zoomAnimation: false,
    dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    boxZoom: false, keyboard: false, touchZoom: false, attributionControl: true
  }).setView([START.lat, START.lng], CFG.zoomNear);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 20,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);

  // ───────── 차량(화살표) ─────────
  const arrowSvg = `
    <svg width="44" height="44" viewBox="-22 -22 44 44" id="arrow">
      <path d="M0 -18 L13 15 L0 8 L-13 15 Z" fill="#e8392b" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>`;
  const marker = L.marker([START.lat, START.lng], {
    icon: L.divIcon({ className: 'car-icon', html: arrowSvg, iconSize: [44, 44], iconAnchor: [22, 22] }),
    interactive: false, keyboard: false, zIndexOffset: 1000
  }).addTo(map);
  const arrowEl = () => document.getElementById('arrow');

  const trail = L.polyline([], { color: '#e8392b', weight: 4, opacity: 0.45, lineCap: 'round' }).addTo(map);

  // ───────── 상태 ─────────
  const car = { lat: START.lat, lng: START.lng, heading: START.heading, v: 0 };
  const keys = { up: false, down: false, left: false, right: false, brake: false };
  let zoom = CFG.zoomNear;
  let trailPts = [];
  let frame = 0;

  // ───────── 입력 ─────────
  const keyMap = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'brake'
  };
  addEventListener('keydown', e => {
    if (e.code === 'KeyR') return resetCar();
    const k = keyMap[e.code];
    if (k) { keys[k] = true; e.preventDefault(); }
  });
  addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) { keys[k] = false; e.preventDefault(); } });
  addEventListener('blur', () => Object.keys(keys).forEach(k => keys[k] = false));

  document.querySelectorAll('.pad button').forEach(btn => {
    const k = btn.dataset.k;
    const on = e => { keys[k] = true; btn.classList.add('on'); e.preventDefault(); };
    const off = e => { keys[k] = false; btn.classList.remove('on'); e.preventDefault(); };
    btn.addEventListener('pointerdown', on);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => btn.addEventListener(t, off));
  });

  function resetCar() {
    Object.assign(car, { lat: START.lat, lng: START.lng, heading: START.heading, v: 0 });
    trailPts = []; trail.setLatLngs([]);
  }
  document.getElementById('reset').addEventListener('click', resetCar);

  // ───────── 게임 루프 ─────────
  const M_PER_DEG = 111320;
  const spdEl = document.getElementById('spd');
  let last = performance.now();

  function step(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    // 가속 / 브레이크 / 자연 감속
    if (keys.up) car.v += CFG.accel * dt;
    if (keys.down) car.v -= (car.v > 0 ? CFG.brake : CFG.accel * 0.6) * dt;
    if (keys.brake) {
      const dv = CFG.brake * 1.2 * dt;
      car.v = Math.abs(car.v) <= dv ? 0 : car.v - Math.sign(car.v) * dv;
    }
    car.v -= car.v * CFG.drag * dt;
    if (!keys.up && !keys.down && Math.abs(car.v) < 0.15) car.v = 0;
    car.v = Math.max(-CFG.maxRev, Math.min(CFG.maxFwd, car.v));

    // 조향: 멈춰 있으면 회전 불가, 고속일수록 둔감
    const steer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const grip = Math.min(1, Math.abs(car.v) / 7) / (1 + Math.abs(car.v) / 60);
    car.heading += steer * CFG.turnRate * grip * Math.sign(car.v || 1) * dt;
    car.heading = (car.heading % 360 + 360) % 360;

    // 위치 갱신 (미터 → 위경도)
    const rad = car.heading * Math.PI / 180;
    const dist = car.v * dt;
    car.lat += (dist * Math.cos(rad)) / M_PER_DEG;
    car.lng += (dist * Math.sin(rad)) / (M_PER_DEG * Math.cos(car.lat * Math.PI / 180));

    // 줌: 빠를수록 멀리 보이게
    const targetZoom = CFG.zoomNear - (CFG.zoomNear - CFG.zoomFar) * Math.min(1, Math.abs(car.v) / CFG.maxFwd);
    zoom += (targetZoom - zoom) * Math.min(1, dt * 2.5);

    // 화면 반영
    const ll = [car.lat, car.lng];
    map.setView(ll, zoom, { animate: false });
    marker.setLatLng(ll);
    const el = arrowEl();
    if (el) el.style.transform = `rotate(${car.heading}deg)`;
    spdEl.textContent = Math.round(Math.abs(car.v) * 3.6);

    // 궤적 (매 3프레임, 최근 250점)
    if (++frame % 3 === 0 && Math.abs(car.v) > 0.5) {
      trailPts.push(ll);
      if (trailPts.length > 250) trailPts.shift();
      trail.setLatLngs(trailPts);
    }

    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
